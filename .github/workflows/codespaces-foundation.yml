name: Codespaces MCP foundation checks
on:
  pull_request:
    paths:
      - 'codespaces-integration/**'
      - '.github/workflows/codespaces-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codespaces-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and safe-controller unit tests
        working-directory: codespaces-integration
        run: |
          node --check scripts/codespaces-core.mjs
          node --check scripts/mcp-stdio.mjs
          node --test tests/*.test.mjs
      - name: Verify MCP SDK imports (no Codespace connection)
        working-directory: codespaces-integration
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "await import('@modelcontextprotocol/sdk/server/mcp.js'); await import('@modelcontextprotocol/sdk/server/stdio.js'); await import('zod');"
